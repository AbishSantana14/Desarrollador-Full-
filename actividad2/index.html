<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Magic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-store"></i> Store Magic</h1>
            <p>Productos de FakeStore API </p>
        </header>
        <main class="main-content">
            <div class="filtros">
                <h3>Filtrar por categoría:</h3>
                <div class="botones-filtro">
                    <button class="filtro-btn activo" data-categoria="all">Todos</button>
                    <button class="filtro-btn" data-categoria="electronics">Electrónica</button>
                    <button class="filtro-btn" data-categoria="jewelery">Joyas</button>
                    <button class="filtro-btn" data-categoria="men's clothing">Ropa Hombre</button>
                    <button class="filtro-btn" data-categoria="women's clothing">Ropa Mujer</button>
                </div>
            </div>

            <div class="contador">
                <p id="contador-texto">Cargando productos...</p>
            </div>
            <div class="productos-grid" id="productos-grid">
                <div class="cargando">
                    <i class="fas fa-spinner fa-spin"></i> Cargando productos...
                </div>
            </div>
            <div class="estadisticas" id="estadisticas">
            </div>
        </main>

        <footer class="footer">
            <p>© 2026 Full Stark</p>
            <p class="api-info">
                <i class="fas fa-database"></i> Datos de: 
                <a href="https://fakestoreapi.com/" target="_blank">FakeStore API</a>
            </p>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
